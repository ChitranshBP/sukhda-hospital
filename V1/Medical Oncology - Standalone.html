  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

idth: 42px; height: 42px; flex: none; border-radius: 11px; background: #F0FDF4; border: 1px solid #BBF7D0; color: #16A34A; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"microscope\" style=\"width: 20px; height: 20px;\"><\u002Fi><\u002Fdiv>\n              <div>\n                <div style=\"font-size: 14.5px; font-weight: 800;\">Weekly tumour board<\u002Fdiv>\n                <div style=\"font-size: 12.5px; color: #5B6480; margin-top: 2px;\">Every case reviewed by 6+ specialists before treatment<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position: absolute; top: 18px; right: 18px; display: inline-flex; align-items: center; gap: 7px; background: rgba(11,30,60,.72); backdrop-filter: blur(8px); border: 1px solid rgba(125,203,107,.4); color: #7DCB6B; padding: 8px 14px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;\"><i data-lucide=\"award\" style=\"width: 14px; height: 14px;\"><\u002Fi>NABH Accredited<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-g=\"stats\" style=\"position: relative; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: rgba(255,255,255,.06); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.14); border-bottom: none; border-radius: 20px 20px 0 0; overflow: hidden;\">\n        <div style=\"padding: 26px 28px; position: relative;\">\n          <div data-statline=\"1\" style=\"position: absolute; right: 0; top: 22%; bottom: 22%; width: 1px; background: rgba(255,255,255,.14);\"><\u002Fdiv>\n          <div style=\"font-size: 30px; font-weight: 800; color: #FFFFFF; letter-spacing: -0.03em; line-height: 1;\">2,500<span style=\"color: #7DCB6B;\">+<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: rgba(247,250,247,.62); margin-top: 8px; font-weight: 500;\">Cancer patients treated<\u002Fdiv>\n        <\u002Fdiv>\n  background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 14px;\">\n            <div style=\"width: 38px; height: 38px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px -5px rgba(22,163,74,.55);\"><i data-lucide=\"users\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fdiv>\n            <div><strong style=\"display: block; font-size: 14.5px; color: #0F172A;\">Tumour Board<\u002Fstrong><span style=\"display: block; font-size: 13px; line-height: 1.55; color: #5B6480; margin-top: 3px;\">Weekly review by a multidisciplinary specialist panel<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-anim=\"1\" style=\"display: flex; gap: 14px; padding: 18px; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 14px;\">\n            <div style=\"width: 38px; height: 38px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px -5px rgba(22,163,74,.55);\"><i data-lucide=\"test-tube\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fdiv>\n            <div><strong style=\"display: block; font-size: 14.5px; color: #0F172A;\">In-house Diagnostics<\u002Fstrong><span style=\"display: block; font-size: 13px; line-height: 1.55; color: #5B6480; margin-top: 3px;\">NABL lab for histopathology, IHC &amp; tumour markers<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-anim=\"1\" style=\"display: flex; gap: 14px; padding: 18px; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 14px;\">\n            <div style=\"width: 38px; height: 38px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px -5px rgba(22,163,74,.55);\"><i data-lucide=\"heart-handshake\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fdiv>\n            <div><strong style=\"display: block; font-size: 14.5px; color: #0F172A;\">Supportive Care<\u002Fstrong><span style=\"display: block; font-size: 13px; line-height: 1.55; color: #5B6480; margin-top: 3px;\">Pain, nutrition, psycho-oncology &amp; palliative support<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-anim=\"1\" style=\"display: flex; gap: 14px; padding: 18px; background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 14px;\">\n            <div style=\"width: 38px; height: 38px; flex: none; border-radius: 10px; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 12px -5px rgba(22,163,74,.55);\"><i data-lucide=\"shield-check\" style=\"width: 18px; height: 18px;\"><\u002Fi><\u002Fdiv>\n            <div><strong style=\"display: block; font-size: 14.5px; color: #0F172A;\">Protocol-Driven<\u002Fstrong><span style=\"display: block; font-size: 13px; line-height: 1.55; color: #5B6480; margin-top: 3px;\">NCCN &amp; ESMO guidelines adapted for Indian patients<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position: sticky; top: 92px; display: flex; flex-direction: column; gap: 16px;\">\n        <div style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 26px; box-shadow: 0 18px 44px -28px rgba(11,30,60,.35);\">\n          <div style=\"display: flex; align-items: center; gap: 10px; font-size: 16.5px; font-weight: 800; color: #12305F; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #E6EFE6;\"><i data-lucide=\"list\" style=\"width: 18px; height: 18px; color: #2E8B3C;\"><\u002Fi>What's on this page<\u002Fdiv>\n          <div data-index=\"1\" style=\"display: flex; flex-direction: column;\">\n            <a href=\"#treatments\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14.5px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"pill\" style=\"width: 17px; height: 17px; color: #2E8B3C;\"><\u002Fi>Treatments &amp; Therapies<i data-lucide=\"arrow-up-right\" style=\"width: 14px; height: 14px; color: #BFDCBF; margin-left: auto;\"><\u002Fi><\u002Fa>\n            <a href=\"#cancers\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14.5px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"activity\" style=\"width: 17px; height: 17px; color: #2E8B3C;\"><\u002Fi>Cancers We Treat<i data-lucide=\"arrow-up-right\" style=\"width: 14px; height: 14px; color: #BFDCBF; margin-left: auto;\"><\u002Fi><\u002Fa>\n            <a href=\"#journey\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14.5px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"route\" style=\"width: 17px; height: 17px; color: #2E8B3C;\"><\u002Fi>Your Patient Journey<i data-lucide=\"arrow-up-right\" style=\"width: 14px; height: 14px; color: #BFDCBF; margin-left: auto;\"><\u002Fi><\u002Fa>\n            <a href=\"#why\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14.5px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"award\" style=\"width: 17px; height: 17px; color: #2E8B3C;\"><\u002Fi>Why Choose Sukhda<i data-lucide=\"arrow-up-right\" style=\"width: 14px; height: 14px; color: #BFDCBF; margin-left: auto;\"><\u002Fi><\u002Fa>\n            <a href=\"#team\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F1F5F9; font-size: 14.5px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"user-check\" style=\"width: 17px; height: 17px; color: #2E8B3C;\"><\u002Fi>Our Specialists<i data-lucide=\"arrow-up-right\" style=\"width: 14px; height: 14px; color: #BFDCBF; margin-left: auto;\"><\u002Fi><\u002Fa>\n            <a href=\"#faqs\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 14.5px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"help-circle\" style=\"width: 17px; height: 17px; color: #2E8B3C;\"><\u002Fi>FAQs<i data-lucide=\"arrow-up-right\" style=\"width: 14px; height: 14px; color: #BFDCBF; margin-left: auto;\"><\u002Fi><\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position: relative; overflow: hidden; background: linear-gradient(135deg, #0B1E3C, #1D4E7A); border-radius: 20px; padding: 28px; color: #F7FAF7;\">\n          <div style=\"position: absolute; top: -30px; right: -30px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(125,203,107,.28), transparent 70%);\"><\u002Fdiv>\n          <div style=\"position: relative;\">\n            <div style=\"display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: #7DCB6B; margin-bottom: 12px;\"><span style=\"width: 7px; height: 7px; border-radius: 50%; background: #7DCB6B; box-shadow: 0 0 0 4px rgba(125,203,107,.2);\"><\u002Fspan>Helpline open now<\u002Fdiv>\n            <div style=\"font-size: 19px; font-weight: 800; margin-bottom: 8px;\">Need urgent help?<\u002Fdiv>\n            <p style=\"margin: 0 0 20px; font-size: 14px; line-height: 1.65; color: rgba(247,250,247,.8);\">Speak to a cancer care coordinator about reports, second opinions or starting treatment.<\u002Fp>\n            <a href=\"tel:+919996544005\" style=\"display: flex; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; padding: 14px 18px; border-radius: 13px; font-size: 15px; font-weight: 700; box-shadow: 0 12px 24px -10px rgba(22,163,74,.6);\"><i data-lucide=\"phone\" style=\"width: 17px; height: 17px;\"><\u002Fi>{{ phone }}<\u002Fa>\n            <div style=\"margin-top: 12px; text-align: center; font-size: 12px; color: rgba(247,250,247,.55);\">Available 24×7 · All 7 days<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"treatments\" data-pad=\"1\" style=\"max-width: 1240px; margin: 0 auto; padding: 92px 32px 0;\">\n    <div data-g=\"head\" data-reveal=\"1\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end; margin-bottom: 40px;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #EAF3EA; color: #2E8B3C; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 18px;\"><i data-lucide=\"pill\" style=\"width: 14px; height: 14px;\"><\u002Fi>Treatment modalities<\u002Fdiv>\n        <h2 style=\"font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.12; letter-spacing: -0.032em; color: #12305F; margin: 0;\">Treatments &amp; <em class=\"serif\" style=\"color: #2E8B3C;\">therapies we offer.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.75; color: #5B6480; margin: 0;\">Every cancer is unique. Our oncologists tailor plans by combining modalities — chemotherapy, immunotherapy, targeted agents and supportive care — to maximise response while minimising side effects.<\u002Fp>\n    <\u002Fdiv>\n    <div data-g=\"c3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <article data-anim=\"1\" data-treat=\"1\" data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-num=\"1\">01<\u002Fdiv>\n        <div style=\"width: 52px; height: 52px; border-radius: 14px; background: #EBF3FC; border: 1px solid #BFDBFE; color: #0F4F94; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"pill\" style=\"width: 25px; height: 25px;\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0; font-size: 20px; font-weight: 800; color: #12305F; letter-spacing: -0.02em;\">Chemotherapy<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: #5B6480;\">Intravenous and oral cytotoxic regimens delivered in a dedicated daycare suite with recliner stations, vitals monitoring and anti-emetic protocols.<\u002Fp>\n        <ul style=\"list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px dashed #DCE6DC; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #4B5563;\">\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Neoadjuvant chemotherapy (pre-surgery tumour shrinkage)<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Adjuvant chemotherapy (residual cell elimination)<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Palliative chemotherapy for advanced-stage cancers<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Metronomic low-dose schedules<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article data-anim=\"1\" data-treat=\"1\" data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-num=\"1\">02<\u002Fdiv>\n        <div style=\"width: 52px; height: 52px; border-radius: 14px; background: #F0FDF4; border: 1px solid #BBF7D0; color: #16A34A; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"shield-check\" style=\"width: 25px; height: 25px;\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0; font-size: 20px; font-weight: 800; color: #12305F; letter-spacing: -0.02em;\">Immunotherapy<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: #5B6480;\">Checkpoint inhibitors (anti-PD-1, anti-PD-L1, anti-CTLA-4) that enlist the body's own immune system, for patients with the right biomarker profile.<\u002Fp>\n        <ul style=\"list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px dashed #DCE6DC; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #4B5563;\">\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Pembrolizumab, Nivolumab, Atezolizumab protocols<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Combination immuno-chemotherapy regimens<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>PD-L1 expression &amp; TMB testing for eligibility<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Immune-related adverse event monitoring<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article data-anim=\"1\" data-treat=\"1\" data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-num=\"1\">03<\u002Fdiv>\n        <div style=\"width: 52px; height: 52px; border-radius: 14px; background: #F5F3FF; border: 1px solid #DDD6FE; color: #7C3AED; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"target\" style=\"width: 25px; height: 25px;\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0; font-size: 20px; font-weight: 800; color: #12305F; letter-spacing: -0.02em;\">Targeted Therapy<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: #5B6480;\">Precision medicine against the genes, proteins and pathways that drive cancer growth, guided by molecular profiling and next-generation sequencing.<\u002Fp>\n        <ul style=\"list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px dashed #DCE6DC; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #4B5563;\">\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Tyrosine kinase inhibitors — EGFR, ALK, ROS1<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>HER2-targeted agents for breast &amp; gastric cancer<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Anti-angiogenic therapies (VEGF pathway)<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>CDK4/6 inhibitors for HR-positive breast cancer<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article data-anim=\"1\" data-treat=\"1\" data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-num=\"1\">04<\u002Fdiv>\n        <div style=\"width: 52px; height: 52px; border-radius: 14px; background: #FFFBEB; border: 1px solid #FDE68A; color: #D97706; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"dna\" style=\"width: 25px; height: 25px;\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0; font-size: 20px; font-weight: 800; color: #12305F; letter-spacing: -0.02em;\">Hormonal Therapy<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: #5B6480;\">Endocrine therapy for hormone-sensitive cancers, blocking the hormones that fuel tumour growth — widely used in breast and prostate cancer.<\u002Fp>\n        <ul style=\"list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px dashed #DCE6DC; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #4B5563;\">\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Aromatase inhibitors (Letrozole, Anastrozole)<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Selective estrogen receptor modulators (Tamoxifen)<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>GnRH agonists / antagonists for prostate cancer<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Androgen deprivation therapy (ADT)<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article data-anim=\"1\" data-treat=\"1\" data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-num=\"1\">05<\u002Fdiv>\n        <div style=\"width: 52px; height: 52px; border-radius: 14px; background: #FFF1F2; border: 1px solid #FECDD3; color: #E11D48; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart-handshake\" style=\"width: 25px; height: 25px;\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0; font-size: 20px; font-weight: 800; color: #12305F; letter-spacing: -0.02em;\">Palliative &amp; Supportive Care<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: #5B6480;\">Symptom management and quality-of-life support at every stage — from early diagnosis through survivorship — for physical, emotional and practical needs.<\u002Fp>\n        <ul style=\"list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px dashed #DCE6DC; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #4B5563;\">\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Expert pain management clinic (WHO ladder protocol)<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Onco-nutrition &amp; dietetics counselling<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Psycho-oncology for patients &amp; families<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Survivorship programs &amp; follow-up monitoring<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article data-anim=\"1\" data-treat=\"1\" data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 32px 28px; display: flex; flex-direction: column; gap: 16px;\">\n        <div data-num=\"1\">06<\u002Fdiv>\n        <div style=\"width: 52px; height: 52px; border-radius: 14px; background: #F0FDFA; border: 1px solid #99F6E4; color: #0D9488; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"armchair\" style=\"width: 25px; height: 25px;\"><\u002Fi><\u002Fdiv>\n        <h3 style=\"margin: 0; font-size: 20px; font-weight: 800; color: #12305F; letter-spacing: -0.02em;\">Daycare Chemotherapy Suite<\u002Fh3>\n        <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: #5B6480;\">A purpose-built outpatient unit designed for comfort and safety, so patients receive treatment and return home the same day without admission.<\u002Fp>\n        <ul style=\"list-style: none; margin: 0; padding: 16px 0 0; border-top: 1px dashed #DCE6DC; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; line-height: 1.55; color: #4B5563;\">\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Individual recliner stations with privacy curtains<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Infusion pumps &amp; syringe drivers for precise dosing<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Emergency crash cart &amp; reaction response<\u002Fspan><\u002Fli>\n          <li style=\"display: grid; grid-template-columns: 16px 1fr; gap: 10px;\"><i data-lucide=\"check\" style=\"width: 15px; height: 15px; color: #16A34A; margin-top: 3px;\"><\u002Fi><span>Port-a-cath insertion &amp; maintenance services<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"cancers\" data-pad=\"1\" style=\"max-width: 1240px; margin: 0 auto; padding: 92px 32px 0;\">\n    <div data-g=\"head\" data-reveal=\"1\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end; margin-bottom: 40px;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #EAF3EA; color: #2E8B3C; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 18px;\"><i data-lucide=\"activity\" style=\"width: 14px; height: 14px;\"><\u002Fi>Scope of care<\u002Fdiv>\n        <h2 style=\"font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.12; letter-spacing: -0.032em; color: #12305F; margin: 0;\">Cancers <em class=\"serif\" style=\"color: #2E8B3C;\">we treat.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.75; color: #5B6480; margin: 0;\">The full spectrum of solid-organ tumours and haematological malignancies across all stages — from early-stage curative intent to advanced palliative management.<\u002Fp>\n    <\u002Fdiv>\n    <div data-g=\"cangrid\" data-reveal=\"1\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n      <div data-anim=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 28px 26px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 8px; border-bottom: 2px solid #EAF3EA;\">\n          <div style=\"width: 42px; height: 42px; border-radius: 12px; background: #EBF3FC; border: 1px solid #BFDBFE; color: #0F4F94; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"scan\" style=\"width: 20px; height: 20px;\"><\u002Fi><\u002Fdiv>\n          <div>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #12305F;\">Solid-organ tumours<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #7A8A7C; font-weight: 500;\">Most common presentations<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Breast Cancer<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Lung Cancer<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Head &amp; Neck Cancer<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Colorectal Cancer<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Stomach &amp; Oesophageal<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Liver, Bile Duct &amp; Pancreatic<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-anim=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 28px 26px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 8px; border-bottom: 2px solid #EAF3EA;\">\n          <div style=\"width: 42px; height: 42px; border-radius: 12px; background: #F0FDF4; border: 1px solid #BBF7D0; color: #16A34A; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"droplets\" style=\"width: 20px; height: 20px;\"><\u002Fi><\u002Fdiv>\n          <div>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #12305F;\">Blood &amp; lymphatic<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #7A8A7C; font-weight: 500;\">Haematological malignancies<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Lymphoma (NHL &amp; HL)<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Leukaemia<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Multiple Myeloma<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Myelodysplastic Syndromes<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: 18px; padding: 14px 16px; background: #F0FDF4; border: 1px dashed #BBF7D0; border-radius: 12px; font-size: 12.5px; line-height: 1.6; color: #15803D;\"><strong>Note:<\u002Fstrong> Complete haematology work-up with same-day CBC, peripheral smear and bone-marrow reporting in our NABL lab.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-anim=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 28px 26px;\">\n        <div style=\"display: flex; align-items: center; gap: 12px; padding-bottom: 16px; margin-bottom: 8px; border-bottom: 2px solid #EAF3EA;\">\n          <div style=\"width: 42px; height: 42px; border-radius: 12px; background: #F5F3FF; border: 1px solid #DDD6FE; color: #7C3AED; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"ribbon\" style=\"width: 20px; height: 20px;\"><\u002Fi><\u002Fdiv>\n          <div>\n            <div style=\"font-size: 16.5px; font-weight: 800; color: #12305F;\">Gynaecological &amp; other<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #7A8A7C; font-weight: 500;\">Specialised programmes<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Ovarian &amp; Cervical Cancer<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Prostate, Bladder &amp; Kidney<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Brain Tumours<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid #F1F5F9; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Thyroid Cancer<\u002Fdiv>\n          <div data-canrow=\"1\" style=\"display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #2A5288;\"><i data-lucide=\"circle-dot\" style=\"width: 15px; height: 15px; color: #2E8B3C; flex: none;\"><\u002Fi>Soft Tissue Sarcoma<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div id=\"why\" style=\"margin-top: 96px; position: relative; overflow: hidden; background: linear-gradient(135deg, #0F2B54 0%, #2A5288 100%); color: #F7FAF7; padding: 88px 0; border-top: 3px solid #7DCB6B;\">\n    <div data-grid-tex=\"1\"><\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; background: radial-gradient(circle at 88% 82%, rgba(125,203,107,.14) 0%, transparent 50%);\"><\u002Fdiv>\n    <div data-pad=\"1\" style=\"position: relative; z-index: 2; max-width: 1240px; margin: 0 auto; padding: 0 32px;\">\n      <div data-g=\"head\" data-reveal=\"1\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end; margin-bottom: 42px;\">\n        <div>\n          <div style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(125,203,107,.14); border: 1px solid rgba(125,203,107,.3); color: #7DCB6B; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 18px;\"><i data-lucide=\"award\" style=\"width: 14px; height: 14px;\"><\u002Fi>Why Sukhda<\u002Fdiv>\n          <h2 style=\"font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.12; letter-spacing: -0.032em; color: #FFFFFF; margin: 0;\">Why families choose <em class=\"serif\" style=\"color: #7DCB6B;\">Sukhda for cancer care.<\u002Fem><\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"font-size: 16px; line-height: 1.75; color: rgba(247,250,247,.78); margin: 0;\">We combine clinical rigour with genuine compassion. Here's what sets our cancer centre apart from other hospitals in the region.<\u002Fp>\n      <\u002Fdiv>\n      <div data-g=\"c3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;\">\n        <div data-why=\"1\" data-reveal=\"1\" style=\"background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 30px 26px; backdrop-filter: blur(4px);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n            <div style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(125,203,107,.15); color: #7DCB6B; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"users\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fdiv>\n            <span style=\"font-size: 30px; font-weight: 800; color: rgba(255,255,255,.12); letter-spacing: -0.04em;\">01<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0 0 10px; font-size: 18.5px; font-weight: 800; color: #FFFFFF;\">Multidisciplinary tumour board<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: rgba(247,250,247,.72);\">Every case reviewed weekly by oncologists, surgeons, pathologists and radiologists for a 360° treatment plan.<\u002Fp>\n        <\u002Fdiv>\n        <div data-why=\"1\" data-reveal=\"1\" style=\"background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 30px 26px; backdrop-filter: blur(4px);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n            <div style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(125,203,107,.15); color: #7D
