er: blur(4px);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n            <div style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(125,203,107,.15); color: #7DCB6B; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"heart\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fdiv>\n            <span style=\"font-size: 30px; font-weight: 800; color: rgba(255,255,255,.12); letter-spacing: -0.04em;\">04<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0 0 10px; font-size: 18.5px; font-weight: 800; color: #FFFFFF;\">Holistic patient support<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: rgba(247,250,247,.72);\">Psycho-oncology counselling, nutrition planning, pain management and family support groups in every plan.<\u002Fp>\n        <\u002Fdiv>\n        <div data-why=\"1\" data-reveal=\"1\" style=\"background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 30px 26px; backdrop-filter: blur(4px);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n            <div style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(125,203,107,.15); color: #7DCB6B; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"flask-conical\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fdiv>\n            <span style=\"font-size: 30px; font-weight: 800; color: rgba(255,255,255,.12); letter-spacing: -0.04em;\">05<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0 0 10px; font-size: 18.5px; font-weight: 800; color: #FFFFFF;\">In-house NABL diagnostics<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: rgba(247,250,247,.72);\">On-campus accredited lab for biopsy, IHC, tumour markers and biochemistry — same-day reports, no referrals.<\u002Fp>\n        <\u002Fdiv>\n        <div data-why=\"1\" data-reveal=\"1\" style=\"background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.13); border-radius: 18px; padding: 30px 26px; backdrop-filter: blur(4px);\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;\">\n            <div style=\"width: 46px; height: 46px; border-radius: 13px; background: rgba(125,203,107,.15); color: #7DCB6B; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"zap\" style=\"width: 22px; height: 22px;\"><\u002Fi><\u002Fdiv>\n            <span style=\"font-size: 30px; font-weight: 800; color: rgba(255,255,255,.12); letter-spacing: -0.04em;\">06<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin: 0 0 10px; font-size: 18.5px; font-weight: 800; color: #FFFFFF;\">Rapid treatment initiation<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14.5px; line-height: 1.68; color: rgba(247,250,247,.72);\">From first consultation to treatment start in under seven days. In cancer, every day counts.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"journey\" data-pad=\"1\" style=\"max-width: 1240px; margin: 0 auto; padding: 92px 32px 0;\">\n    <div data-g=\"head\" data-reveal=\"1\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end; margin-bottom: 48px;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #EAF3EA; color: #2E8B3C; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 18px;\"><i data-lucide=\"route\" style=\"width: 14px; height: 14px;\"><\u002Fi>Patient journey<\u002Fdiv>\n        <h2 style=\"font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.12; letter-spacing: -0.032em; color: #12305F; margin: 0;\">Your path through <em class=\"serif\" style=\"color: #2E8B3C;\">cancer treatment.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.75; color: #5B6480; margin: 0;\">From your first consultation to long-term survivorship monitoring, here's exactly how we guide you through every stage of care at Sukhda.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position: relative;\">\n      <div data-statline=\"1\" style=\"position: absolute; top: 24px; left: 40px; right: 40px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #16A34A 0%, #7DCB6B 55%, #DCE6DC 100%);\"><\u002Fdiv>\n      <div data-g=\"j6\" style=\"position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px;\">\n        <div data-reveal=\"1\" style=\"text-align: left;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; border: 4px solid #F7FAF7; box-shadow: 0 8px 18px -8px rgba(22,163,74,.6); margin-bottom: 18px; position: relative;\">1<\u002Fdiv>\n          <h4 style=\"margin: 0 0 8px; font-size: 15.5px; font-weight: 800; color: #12305F;\">First consultation<\u002Fh4>\n          <p style=\"margin: 0; font-size: 13.5px; line-height: 1.62; color: #5B6480;\">History, examination and review of existing reports by a senior oncologist.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"text-align: left;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; border: 4px solid #F7FAF7; box-shadow: 0 8px 18px -8px rgba(22,163,74,.6); margin-bottom: 18px; position: relative;\">2<\u002Fdiv>\n          <h4 style=\"margin: 0 0 8px; font-size: 15.5px; font-weight: 800; color: #12305F;\">Diagnostics &amp; staging<\u002Fh4>\n          <p style=\"margin: 0; font-size: 13.5px; line-height: 1.62; color: #5B6480;\">Biopsy, CT/PET imaging, immunohistochemistry and molecular profiling.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"text-align: left;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; border: 4px solid #F7FAF7; box-shadow: 0 8px 18px -8px rgba(22,163,74,.6); margin-bottom: 18px; position: relative;\">3<\u002Fdiv>\n          <h4 style=\"margin: 0 0 8px; font-size: 15.5px; font-weight: 800; color: #12305F;\">Tumour board review<\u002Fh4>\n          <p style=\"margin: 0; font-size: 13.5px; line-height: 1.62; color: #5B6480;\">Six or more specialists agree a personalised treatment plan.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"text-align: left;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 50%; background: #FFFFFF; color: #16A34A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; border: 2px solid #BBF7D0; box-shadow: 0 8px 18px -10px rgba(11,30,60,.3); margin-bottom: 18px; position: relative;\">4<\u002Fdiv>\n          <h4 style=\"margin: 0 0 8px; font-size: 15.5px; font-weight: 800; color: #12305F;\">Treatment begins<\u002Fh4>\n          <p style=\"margin: 0; font-size: 13.5px; line-height: 1.62; color: #5B6480;\">Therapy initiated with close monitoring and supportive care alongside.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"text-align: left;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 50%; background: #FFFFFF; color: #16A34A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; border: 2px solid #BBF7D0; box-shadow: 0 8px 18px -10px rgba(11,30,60,.3); margin-bottom: 18px; position: relative;\">5<\u002Fdiv>\n          <h4 style=\"margin: 0 0 8px; font-size: 15.5px; font-weight: 800; color: #12305F;\">Response assessment<\u002Fh4>\n          <p style=\"margin: 0; font-size: 13.5px; line-height: 1.62; color: #5B6480;\">Periodic scans and blood work; the regimen is adjusted where needed.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"text-align: left;\">\n          <div style=\"width: 50px; height: 50px; border-radius: 50%; background: #FFFFFF; color: #16A34A; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; border: 2px solid #BBF7D0; box-shadow: 0 8px 18px -10px rgba(11,30,60,.3); margin-bottom: 18px; position: relative;\">6<\u002Fdiv>\n          <h4 style=\"margin: 0 0 8px; font-size: 15.5px; font-weight: 800; color: #12305F;\">Survivorship &amp; follow-up<\u002Fh4>\n          <p style=\"margin: 0; font-size: 13.5px; line-height: 1.62; color: #5B6480;\">Long-term monitoring, recurrence screening and life beyond cancer.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"team\" data-pad=\"1\" style=\"max-width: 1240px; margin: 0 auto; padding: 92px 32px 0;\">\n    <div data-g=\"head\" data-reveal=\"1\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: end; margin-bottom: 40px;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #EAF3EA; color: #2E8B3C; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 18px;\"><i data-lucide=\"user-check\" style=\"width: 14px; height: 14px;\"><\u002Fi>Our team<\u002Fdiv>\n        <h2 style=\"font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.12; letter-spacing: -0.032em; color: #12305F; margin: 0;\">Meet our <em class=\"serif\" style=\"color: #2E8B3C;\">oncology experts.<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.75; color: #5B6480; margin: 0;\">Experienced medical oncologists, nursing staff trained in onco-care and allied health professionals dedicated to fighting cancer alongside you.<\u002Fp>\n    <\u002Fdiv>\n    <div data-g=\"team\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\">\n      <div data-anim=\"1\" data-reveal=\"1\" style=\"position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 30px;\">\n        <div style=\"position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #16A34A, #7DCB6B);\"><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 20px;\">\n          <div style=\"width: 76px; height: 76px; flex: none; border-radius: 22px; background: linear-gradient(135deg, #EAF3EA, #D9EED9); border: 2px solid #BFDCBF; color: #2E8B3C; font-weight: 800; font-size: 23px; display: flex; align-items: center; justify-content: center;\">SC<\u002Fdiv>\n          <div>\n            <h3 style=\"margin: 0 0 4px; font-size: 19px; font-weight: 800; color: #12305F;\">Sukhda Cancer Care Team<\u002Fh3>\n            <div style=\"font-size: 13.5px; font-weight: 700; color: #2E8B3C; margin-bottom: 6px;\">Medical Oncology<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #7A8A7C; line-height: 1.55;\">Multidisciplinary team of oncologists, onco-surgeons, pathologists &amp; support staff<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;\">\n          <span style=\"font-size: 11.5px; font-weight: 700; color: #15803D; background: #F0FDF4; border: 1px solid #BBF7D0; padding: 5px 12px; border-radius: 999px;\">Tumour board<\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 700; color: #15803D; background: #F0FDF4; border: 1px solid #BBF7D0; padding: 5px 12px; border-radius: 999px;\">Daycare chemo<\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 700; color: #15803D; background: #F0FDF4; border: 1px solid #BBF7D0; padding: 5px 12px; border-radius: 999px;\">Palliative care<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-anim=\"1\" data-reveal=\"1\" style=\"position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 20px; padding: 30px;\">\n        <div style=\"position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #12305F, #2A5288);\"><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 20px;\">\n          <div style=\"width: 76px; height: 76px; flex: none; border-radius: 22px; background: linear-gradient(135deg, #EBF3FC, #DBEAFE); border: 2px solid #BFDBFE; color: #0F4F94; font-weight: 800; font-size: 23px; display: flex; align-items: center; justify-content: center;\">AM<\u002Fdiv>\n          <div>\n            <h3 style=\"margin: 0 0 4px; font-size: 19px; font-weight: 800; color: #12305F;\">Dr. Amit Mehta<\u002Fh3>\n            <div style=\"font-size: 13.5px; font-weight: 700; color: #2E8B3C; margin-bottom: 6px;\">Internal Medicine &amp; Cancer Screening<\u002Fdiv>\n            <div style=\"font-size: 13px; color: #7A8A7C; line-height: 1.55;\">MD (AIIMS) · Founder &amp; Director<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap;\">\n          <span style=\"font-size: 11.5px; font-weight: 700; color: #12305F; background: #EBF3FC; border: 1px solid #BFDBFE; padding: 5px 12px; border-radius: 999px;\">Early detection<\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 700; color: #12305F; background: #EBF3FC; border: 1px solid #BFDBFE; padding: 5px 12px; border-radius: 999px;\">Screening programmes<\u002Fspan>\n          <span style=\"font-size: 11.5px; font-weight: 700; color: #12305F; background: #EBF3FC; border: 1px solid #BFDBFE; padding: 5px 12px; border-radius: 999px;\">AIIMS alumnus<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faqs\" data-pad=\"1\" style=\"max-width: 1240px; margin: 0 auto; padding: 92px 32px 0;\">\n    <div data-g=\"faq\" style=\"display: grid; grid-template-columns: .85fr 1.15fr; gap: 48px; align-items: start;\">\n      <div data-reveal=\"1\" style=\"position: sticky; top: 92px;\">\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #EAF3EA; color: #2E8B3C; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 18px;\"><i data-lucide=\"help-circle\" style=\"width: 14px; height: 14px;\"><\u002Fi>FAQs<\u002Fdiv>\n        <h2 style=\"font-size: clamp(30px, 3.4vw, 42px); font-weight: 800; line-height: 1.12; letter-spacing: -0.032em; color: #12305F; margin: 0 0 18px;\">Common <em class=\"serif\" style=\"color: #2E8B3C;\">questions answered.<\u002Fem><\u002Fh2>\n        <p style=\"font-size: 16px; line-height: 1.75; color: #5B6480; margin: 0 0 26px;\">We understand a cancer diagnosis brings many questions. Here are answers to the ones our patients ask most.<\u002Fp>\n        <div style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 18px; padding: 22px 24px; box-shadow: 0 14px 32px -26px rgba(11,30,60,.4);\">\n          <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 6px;\">\n            <div style=\"width: 40px; height: 40px; border-radius: 11px; background: #F0FDF4; border: 1px solid #BBF7D0; color: #16A34A; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"message-circle-question\" style=\"width: 19px; height: 19px;\"><\u002Fi><\u002Fdiv>\n            <div style=\"font-size: 15.5px; font-weight: 800; color: #12305F;\">Still have questions?<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin: 0 0 16px; font-size: 13.5px; line-height: 1.65; color: #5B6480;\">Our cancer care coordinators are happy to talk you through anything — no appointment needed.<\u002Fp>\n          <a href=\"tel:+919996544005\" style=\"display: inline-flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 800; color: #15803D;\"><i data-lucide=\"phone\" style=\"width: 16px; height: 16px;\"><\u002Fi>{{ phone }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <div data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -24px rgba(11,30,60,.4);\">\n          <button type=\"button\" data-faqq=\"1\" sc-camel-on-click=\"{{ toggleFaq }}\" style=\"width: 100%; background: none; border: 0; padding: 21px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #12305F;\">What is the difference between chemotherapy and immunotherapy?<span data-chevwrap=\"1\" style=\"width: 30px; height: 30px; flex: none; border-radius: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"plus\" data-chev=\"1\" style=\"width: 16px; height: 16px; color: #16A34A; transition: transform .25s ease;\"><\u002Fi><\u002Fspan><\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"display: none; padding: 0 24px 22px; font-size: 14.5px; line-height: 1.75; color: #5B6480;\">Chemotherapy uses cytotoxic drugs to directly kill rapidly dividing cancer cells, which can also affect normal cells and cause side effects such as hair loss and nausea. Immunotherapy instead stimulates the body's own immune system to recognise and attack cancer cells specifically, often with a different side-effect profile. Your oncologist will determine which approach — or combination — suits your cancer type and biomarker profile.<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -24px rgba(11,30,60,.4);\">\n          <button type=\"button\" data-faqq=\"1\" sc-camel-on-click=\"{{ toggleFaq }}\" style=\"width: 100%; background: none; border: 0; padding: 21px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #12305F;\">How long does a typical chemotherapy session take?<span data-chevwrap=\"1\" style=\"width: 30px; height: 30px; flex: none; border-radius: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"plus\" data-chev=\"1\" style=\"width: 16px; height: 16px; color: #16A34A; transition: transform .25s ease;\"><\u002Fi><\u002Fspan><\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"display: none; padding: 0 24px 22px; font-size: 14.5px; line-height: 1.75; color: #5B6480;\">A single session in our daycare suite typically takes two to six hours, depending on the drug regimen. That includes pre-medication to prevent nausea, the infusion itself and a short observation period afterwards. Most patients return home the same day, on a schedule your oncologist sets out in advance.<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -24px rgba(11,30,60,.4);\">\n          <button type=\"button\" data-faqq=\"1\" sc-camel-on-click=\"{{ toggleFaq }}\" style=\"width: 100%; background: none; border: 0; padding: 21px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #12305F;\">Will I lose my hair during cancer treatment?<span data-chevwrap=\"1\" style=\"width: 30px; height: 30px; flex: none; border-radius: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"plus\" data-chev=\"1\" style=\"width: 16px; height: 16px; color: #16A34A; transition: transform .25s ease;\"><\u002Fi><\u002Fspan><\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"display: none; padding: 0 24px 22px; font-size: 14.5px; line-height: 1.75; color: #5B6480;\">It depends on the specific drugs used. Many traditional chemotherapy agents cause temporary hair loss that reverses after treatment ends, while newer targeted therapies and immunotherapies often cause little or none. Our team will discuss the expected effects of your regimen and the support available, including scalp cooling where applicable.<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -24px rgba(11,30,60,.4);\">\n          <button type=\"button\" data-faqq=\"1\" sc-camel-on-click=\"{{ toggleFaq }}\" style=\"width: 100%; background: none; border: 0; padding: 21px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #12305F;\">What is a tumour board and why is it important?<span data-chevwrap=\"1\" style=\"width: 30px; height: 30px; flex: none; border-radius: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"plus\" data-chev=\"1\" style=\"width: 16px; height: 16px; color: #16A34A; transition: transform .25s ease;\"><\u002Fi><\u002Fspan><\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"display: none; padding: 0 24px 22px; font-size: 14.5px; line-height: 1.75; color: #5B6480;\">A tumour board is a weekly conference where your case is reviewed by medical, surgical and radiation oncologists together with pathologists and radiologists. This collaborative approach considers every angle, combines evidence from multiple disciplines and avoids single-doctor bias. Reviews of this kind are consistently associated with better treatment outcomes.<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -24px rgba(11,30,60,.4);\">\n          <button type=\"button\" data-faqq=\"1\" sc-camel-on-click=\"{{ toggleFaq }}\" style=\"width: 100%; background: none; border: 0; padding: 21px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #12305F;\">Does Sukhda accept health insurance for cancer treatment?<span data-chevwrap=\"1\" style=\"width: 30px; height: 30px; flex: none; border-radius: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"plus\" data-chev=\"1\" style=\"width: 16px; height: 16px; color: #16A34A; transition: transform .25s ease;\"><\u002Fi><\u002Fspan><\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"display: none; padding: 0 24px 22px; font-size: 14.5px; line-height: 1.75; color: #5B6480;\">Yes. Sukhda Medpark is empanelled with major TPA insurance providers and offers cashless hospitalisation for eligible policies. Our dedicated billing and insurance desk assists with pre-authorisation, documentation and claims processing, so you can focus on recovery rather than paperwork.<\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background: #FFFFFF; border: 1px solid #DCE6DC; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 26px -24px rgba(11,30,60,.4);\">\n          <button type=\"button\" data-faqq=\"1\" sc-camel-on-click=\"{{ toggleFaq }}\" style=\"width: 100%; background: none; border: 0; padding: 21px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; text-align: left; font-family: inherit; font-size: 15.5px; font-weight: 700; color: #12305F;\">What should I bring to my first oncology consultation?<span data-chevwrap=\"1\" style=\"width: 30px; height: 30px; flex: none; border-radius: 9px; background: #F0FDF4; border: 1px solid #BBF7D0; display: flex; align-items: center; justify-content: center;\"><i data-lucide=\"plus\" data-chev=\"1\" style=\"width: 16px; height: 16px; color: #16A34A; transition: transform .25s ease;\"><\u002Fi><\u002Fspan><\u002Fbutton>\n          <div data-faq-body=\"1\" style=\"display: none; padding: 0 24px 22px; font-size: 14.5px; line-height: 1.75; color: #5B6480;\">Please bring all previous medical reports (blood work, biopsy reports, CT/MRI/PET imaging), treatment records from other hospitals, a list of current medications, your health insurance card if applicable, and a family member or companion. Arriving fifteen minutes early helps complete registration smoothly.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div id=\"contact\" style=\"margin-top: 96px; position: relative; overflow: hidden; background: linear-gradient(135deg, #0B1E3C 0%, #163A66 100%); color: #F7FAF7; padding: 88px 0; border-top: 3px solid #7DCB6B;\">\n    <div data-grid-tex=\"1\"><\u002Fdiv>\n    <div style=\"position: absolute; inset: 0; background: radial-gradient(circle at 24% 60%, rgba(125,203,107,.15) 0%, transparent 55%);\"><\u002Fdiv>\n    <div data-pad=\"1\" style=\"position: relative; z-index: 2; max-width: 1240px; margin: 0 auto; padding: 0 32px;\">\n      <div data-g=\"cta\" style=\"display: grid; grid-template-columns: 1.2fr .8fr; gap: 56px; align-items: center;\">\n        <div data-reveal=\"1\">\n          <div style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(125,203,107,.14); border: 1px solid rgba(125,203,107,.3); color: #7DCB6B; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; margin-bottom: 22px;\"><i data-lucide=\"calendar-heart\" style=\"width: 14px; height: 14px;\"><\u002Fi>Take the first step<\u002Fdiv>\n          <h2 style=\"font-size: clamp(32px, 4vw, 50px); font-weight: 800; line-height: 1.1; letter-spacing: -0.032em; color: #FFFFFF; margin: 0 0 18px;\">Start your journey to <em class=\"serif\" style=\"color: #7DCB6B;\">recovery today.<\u002Fem><\u002Fh2>\n          <p style=\"font-size: 16.5px; line-height: 1.72; color: rgba(247,250,247,.78); margin: 0 0 32px; max-width: 520px;\">Our oncology specialists are available seven days a week. Schedule a consultation or speak to our cancer care coordinator for guidance on next steps.<\u002Fp>\n          <div style=\"display: flex; gap: 14px; flex-wrap: wrap;\">\n            <a href=\"/#contact\" style=\"display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #16A34A, #15803D); color: #FFFFFF; padding: 16px 28px; border-radius: 13px; font-size: 15px; font-weight: 700; box-shadow: 0 16px 34px -12px rgba(22,163,74,.75);\"><i data-lucide=\"calendar-check\" style=\"width: 18px; height: 18px;\"><\u002Fi>Book consultation<\u002Fa>\n            <a href=\"tel:+919996544005\" style=\"display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.28); color: #FFFFFF; padding: 16px 28px; border-radius: 13px; font-size: 15px; font-weight: 700;\"><i data-lucide=\"phone\" style=\"width: 18px; height: 18px;\"><\u002Fi>{{ phone }}<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"1\" style=\"background: rgba(255,255,255,.06); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 30px;\">\n          <div style=\"font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: #7DCB6B; margin-bottom: 20px;\">Visit us<\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n            <div style=\"display: flex; gap: 14px;\">\n              <i data-lucide=\"map-pin\" style=\"width: 19px; height: 19px; color: #7DCB6B; flex: none; margin-top: 2px;\"><\u002Fi>\n              <div><div style=\"font-size: 14.5px; font-weight: 700; color: #FFFFFF;\">Sukhda Medpark, Hisar<\u002Fdiv><div style=\"font-size: 13px; color: rgba(247,250,247,.65); margin-top: 3px;\">Haryana, India<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 14px;\">\n              <i data-lucide=\"clock\" style=\"width: 19px; height: 19px; color: #7DCB6B; flex: none; margin-top: 2px;\"><\u002Fi>\n              <div><div style=\"font-size: 14.5px; font-weight: 700; color: #FFFFFF;\">OPD: Mon–Sat, 9 am – 5 pm<\u002Fdiv><div style=\"font-size: 13px; color: rgba(247,250,247,.65); margin-top: 3px;\">Emergency &amp; helpline: 24×7, all days<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 14px;\">\n              <i data-lucide=\"phone-call\" style=\"width: 19px; height: 19px; color: #7DCB6B; flex: none; margin-top: 2px;\"><\u002Fi>\n              <div><div style=\"font-size: 14.5px; font-weight: 700; color: #FFFFFF;\">{{ phone }}<\u002Fdiv><div style=\"font-size: 13px; color: rgba(247,250,247,.65); margin-top: 3px;\">Cancer care coordinator<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"background: #081729; color: rgba(247,250,247,.6); padding: 26px 0;\">\n    <div data-pad=\"1\" style=\"max-width: 1240px; margin: 0 auto; padding: 0 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; font-size: 13px;\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <div style=\"width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #12305F, #2A5288); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;\">S<\u002Fdiv>\n        <span style=\"font-weight: 700; color: #F7FAF7;\">Sukhda Medpark<\u002Fspan>\n        <span style=\"opacity: .5;\">· Department of Medical Oncology<\u002Fspan>\n      <\u002Fdiv>\n      <div>NABH accredited · NABL laboratory · Hisar, Haryana<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;+91-99965-44005&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.icons();\n    this.reveal();\n  }\n  componentDidUpdate() { this.icons(); }\n  icons() {\n    const run = () => window.lucide && window.lucide.createIcons();\n    run();\n    if (!window.lucide) setTimeout(run, 400);\n  }\n  reveal() {\n    const els = document.querySelectorAll('[data-reveal]');\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((en) => {\n        if (en.isIntersecting) { en.target.classList.add('rv-in'); io.unobserve(en.target); }\n      });\n    }, { threshold: 0.12 });\n    els.forEach((el) => {\n      const r = el.getBoundingClientRect();\n      if (r.top > window.innerHeight * 0.92) { el.classList.add('rv'); io.observe(el); }\n    });\n  }\n  renderVals() {\n    return {\n      phone: this.props.phone ?? '+91-99965-44005',\n      toggleFaq: (e) => {\n        const card = e.currentTarget.parentElement;\n        const body = card.querySelector('[data-faq-body]');\n        const chev = e.currentTarget.querySelector('[data-chev]');\n        const open = body.style.display === 'block';\n        body.style.display = open ? 'none' : 'block';\n        card.style.borderColor = open ? '#DCE6DC' : '#BFDCBF';\n        if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(45deg)';\n      },\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
