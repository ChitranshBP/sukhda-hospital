# Netlify deployment config (V1)
[build]
  command  = "php build.php"
  publish  = "dist"

[build.environment]
  PHP_VERSION = "8.2"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Medical Oncology PHP & clean URL redirect
[[redirects]]
  from   = "/medical-oncology.php"
  to     = "/medical-oncology.html"
  status = 301

[[redirects]]
  from   = "/medical-oncology"
  to     = "/medical-oncology.html"
  status = 200

[[redirects]]
  from   = "/index.php"
  to     = "/"
  status = 301

# Pretty 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

