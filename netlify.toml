# Netlify deployment config
# Build command runs `php build.php` which renders index.php → dist/index.html
# and copies /assets so Netlify can serve the result as a static site.
# Build command runs `php build.php` which renders root & V1 pages into dist/
# Output supports https://sukhda-hospital-new.netlify.app/ and /V1/

[build]
  command  = "php build.php"
  publish  = "dist"

# Netlify's default Ubuntu image ships with PHP 8.x available on PATH; no
# extra install step is needed. If a future image drops PHP, switch the
# command to:  apt-get update -qq && apt-get install -y php-cli && php build.php

[build.environment]
  PHP_VERSION = "8.2"

# Long-cache for fingerprintable static assets
# Long-cache for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should always revalidate
[[headers]]
  for = "/V1/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/V1/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# V1 folder root redirect
[[redirects]]
  from   = "/V1"
  to     = "/v1/"
  status = 301

[[redirects]]
  from   = "/v1"
  to     = "/v1/"
  status = 301

[[redirects]]
  from   = "/V1/"
  to     = "/v1/"
  status = 301

# V1 Services Clean URLs & PHP redirects
[[redirects]]
  from   = "/v1/service/:page.php"
  to     = "/v1/service/:page.html"
  status = 301

[[redirects]]
  from   = "/v1/service/:page"
  to     = "/v1/service/:page.html"
  status = 200

[[redirects]]
  from   = "/V1/service/:page.php"
  to     = "/V1/service/:page.html"
  status = 301

[[redirects]]
  from   = "/V1/service/:page"
  to     = "/V1/service/:page.html"
  status = 200

# V1 Service-Redesign Clean URLs & PHP redirects
[[redirects]]
  from   = "/v1/service-redesign/:page.php"
  to     = "/v1/service-redesign/:page.html"
  status = 301

[[redirects]]
  from   = "/v1/service-redesign/:page"
  to     = "/v1/service-redesign/:page.html"
  status = 200

[[redirects]]
  from   = "/V1/service-redesign/:page.php"
  to     = "/V1/service-redesign/:page.html"
  status = 301

[[redirects]]
  from   = "/V1/service-redesign/:page"
  to     = "/V1/service-redesign/:page.html"
  status = 200

# Root Services Clean URLs & PHP redirects
[[redirects]]
  from   = "/service/:page.php"
  to     = "/service/:page.html"
  status = 301

[[redirects]]
  from   = "/service/:page"
  to     = "/service/:page.html"
  status = 200

[[redirects]]
  from   = "/service-redesign/:page.php"
  to     = "/service-redesign/:page.html"
  status = 301

[[redirects]]
  from   = "/service-redesign/:page"
  to     = "/service-redesign/:page.html"
  status = 200

# Legacy medical-oncology direct redirects
[[redirects]]
  from   = "/v1/medical-oncology"
  to     = "/v1/service/medical-oncology"
  status = 301

[[redirects]]
  from   = "/V1/medical-oncology"
  to     = "/v1/service/medical-oncology"
  status = 301

[[redirects]]
  from   = "/medical-oncology"
  to     = "/service/medical-oncology"
  status = 301

[[redirects]]
  from   = "/V1/index.php"
  to     = "/v1/"
  status = 301

[[redirects]]
  from   = "/v1/index.php"
  to     = "/v1/"
  status = 301

[[redirects]]
  from   = "/index.php"
  to     = "/"
  status = 301

# Pretty 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

