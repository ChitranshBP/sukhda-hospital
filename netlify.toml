# Netlify deployment config
# Build command runs `php build.php` which renders root & V1 pages into dist/
# Output supports https://sukhda-hospital-new.netlify.app/ and /V1/

[build]
  command  = "php build.php"
  publish  = "dist"

[build.environment]
  PHP_VERSION = "8.2"

# Long-cache for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/V1/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/V1/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# V1 folder root redirect
[[redirects]]
  from   = "/V1"
  to     = "/V1/"
  status = 301

# V1 Medical Oncology Clean URLs & PHP redirect
[[redirects]]
  from   = "/V1/medical-oncology.php"
  to     = "/V1/medical-oncology.html"
  status = 301

[[redirects]]
  from   = "/V1/medical-oncology"
  to     = "/V1/medical-oncology.html"
  status = 200

[[redirects]]
  from   = "/V1/index.php"
  to     = "/V1/"
  status = 301

# Root Medical Oncology Clean URLs & PHP redirect
[[redirects]]
  from   = "/medical-oncology.php"
  to     = "/medical-oncology.html"
  status = 301

[[redirects]]
  from   = "/medical-oncology"
  to     = "/medical-oncology.html"
  status = 200

[[redirects]]
  from   = "/index.php"
  to     = "/"
  status = 301

# Pretty 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

